name: Finish credential media and navigation
on:
  push:
    branches: [content/credential-and-brand-media]
    paths: ['.github/workflows/finish-credential-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    if: github.ref == 'refs/heads/content/credential-and-brand-media'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/crop-credential-previews.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/finish-credential-media.mjs
      - run: node scripts/build.mjs && node scripts/build.mjs --check
      - name: Commit finished media and both pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/credentials src/templates/about.html index.html ar/index.html
          git commit -m "Crop original certificates and regenerate compact bilingual navigation"
          git push origin HEAD:content/credential-and-brand-media
