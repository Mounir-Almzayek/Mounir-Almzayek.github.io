name: Generate portfolio social preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/social-preview.yml']
permissions:
  contents: write
concurrency:
  group: portfolio-social-preview
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Capture actual portfolio hero and install social metadata
        run: |
          mkdir -p assets/social
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch();
          const page=await browser.newPage({viewport:{width:1200,height:630},deviceScaleFactor:1,reducedMotion:'reduce',colorScheme:'light'});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
          await page.evaluate(()=>{document.documentElement.dataset.theme='light';});
          await page.addStyleTag({content:'.wrap{max-width:1200px;padding-left:48px;padding-right:48px}.top nav{min-height:58px}.hero{padding:23px 0 20px;gap:35px;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}.hero h1{font-size:74px;margin:15px 0 12px}.hero-role{font-size:19px;margin:12px 0 5px}.hero .lede{font-size:17px;max-width:490px}.hero .actions{margin-top:20px}.hero-social{margin-top:17px}.profile-stage{max-width:400px;padding:34px 15px}.profile-stage .profile-panel{padding:11px}.specialty-item{padding:5px 7px;gap:5px}.specialty-icon{width:17px;height:17px}.specialty-item strong{font-size:9px}.specialty-item small{font-size:8px}.profile-stage .profile-footer{padding-top:8px}.track{margin:0 0 24px}.track>div{padding:10px 16px}.track strong{font-size:15px}.track span{font-size:10px}.navlinks .theme-toggle{display:none}.motion-toggle{display:none!important}'});
          await page.locator('.profile-photo').evaluate(i=>i.decode());
          await page.evaluate(()=>document.fonts.ready);
          await page.locator('.hero').waitFor();
          const hero=await page.locator('.hero').boundingBox();
          const portrait=await page.locator('.profile-photo').boundingBox();
          const name=await page.locator('.hero h1').boundingBox();
          if(!hero||!portrait||!name||hero.y+hero.height>630||portrait.y+portrait.height>630||name.x+name.width>1200||portrait.width<280)throw Error('Hero does not fit social preview: '+JSON.stringify({hero,portrait,name}));
          if(errors.length)throw Error(errors.join('; '));
          const path='assets/social/portfolio-preview.jpg';
          await page.screenshot({path,type:'jpeg',quality:94,animations:'disabled'});
          const bytes=fs.readFileSync(path);
          const d=await page.evaluate(async src=>{const img=new Image();img.src=src;await img.decode();return [img.naturalWidth,img.naturalHeight]},'data:image/jpeg;base64,'+bytes.toString('base64'));
          if(d[0]!==1200||d[1]!==630)throw Error('Wrong preview dimensions');
          const url='https://mounir-almzayek.github.io/assets/social/portfolio-preview.jpg';
          console.log(JSON.stringify({path,dimensions:d,bytes:bytes.length,hero,portrait,name}));
          await page.reload({waitUntil:'domcontentloaded'});
          if(await page.locator('meta[property="og:image"]').count()!==1||await page.locator('meta[property="og:image"]').getAttribute('content')!==url)throw Error('Open Graph metadata missing');
          if(await page.locator('.project').count()!==18)throw Error('Project count changed');
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-social-preview
          path: assets/social/portfolio-preview.jpg
      - name: Publish share image and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/social/portfolio-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add actual portfolio homepage Open Graph preview"
            git push origin HEAD:main
          fi
