name: Complete real project source previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-previews.yml']
permissions:
  contents: write
concurrency:
  group: portfolio-source-previews
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Resolve and capture real public sources
        run: |
          mkdir -p assets/previews/sources
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch();
          const html=fs.readFileSync('index.html','utf8');
          const cards=[...html.matchAll(/<article class="project[^"]*"[^>]*>[\s\S]*?<\/article>/g)].map(m=>m[0]);
          const report=[];
          const replacements=new Map();
          const official={
            'Rai — National Center for Public Opinion Polls':{url:'https://ncpop.org.sa/',file:'rai-official',label:'Official client organization website · not the survey app'},
            'Visitors Management':{url:'https://visitors-rs.com/',alternatives:['https://visitors-rs.com/companies/','https://www.rs4it.sa/service/نظام-إدارة-الزوار-للمنشآت/'],file:'visitors-official',label:'Official Visitors product website'}
          };
          const custom={
            'Wusol':['https://wusol.me/ar','https://wusol.me/en','https://app.wusol.me/ar/auth/login?next=%2Far%2Fhome'],
            'Zaker':['https://zaker.misbar.education/','https://play.google.com/store/apps/details?id=com.misbar.zaker'],
            'AutoContent AI':['https://raw.githubusercontent.com/Mounir-Almzayek/AutoContent-AI/main/docs/screenshot/Screenshot%202026-03-12%20151520.png'],
            'Wasfeh':['https://raw.githubusercontent.com/Mounir-Almzayek/Wasfeh/main/assets/images/wasfeh.png']
          };
          const esc=s=>s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;');
          async function capture(card,index){
            const name=card.match(/<h3>(.*?)<\/h3>/)?.[1]||'Project';
            if((name==='Swimmer Craftsman'||name==='Zaker')&&card.includes('https://play-lh.googleusercontent.com/')){
              const urls=[...card.matchAll(/src="(https:\/\/play-lh\.googleusercontent\.com\/[^"]+)"/g)].map(m=>m[1]);
              let updated=card;const files=[];
              const ctx=await browser.newContext();
              try{
                for(const [i,url] of urls.entries()){
                  try{
                    const res=await ctx.request.get(url,{timeout:15000});
                    const type=(res.headers()['content-type']||'').split(';')[0];
                    const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[type];
                    if(!res.ok()||!ext)continue;
                    const bytes=await res.body();if(bytes.length<2000)continue;
                    const path='assets/previews/sources/'+(name==='Zaker'?'zaker':'swimmer-craftsman')+'-'+(i+1)+'.'+ext;
                    fs.writeFileSync(path,bytes);updated=updated.replace(url,path);files.push(path);
                  }catch{}
                }
              }finally{await ctx.close();}
              if(files.length)replacements.set(card,updated);
              report.push({name,status:files.length?'captured':'remote originals',files});return;
            }
            const target=official[name];
            if(target?.file==='rai-official'&&card.includes('assets/previews/sources/rai-official.jpg')){report.push({name,status:'existing genuine image',kind:target.label,url:target.url,path:'assets/previews/sources/rai-official.jpg'});return;}
            if(!target && /<img\b/.test(card)){report.push({name,status:'existing genuine image'});return;}
            const repo=card.match(/href="(https:\/\/github\.com\/Mounir-Almzayek\/[^"]+)"/)?.[1];
            const candidates=target?[target.url,...(target.alternatives||[])]:[...(custom[name]||[]),...(repo?[repo]:[])];
            const designTitles={'Clinic Hub':'clinic app','Sold Out / Order Application':'order app','Connect Four':'connect four'};
            if(designTitles[name]){
              const profile=await browser.newPage();
              try{
                await profile.goto('https://www.behance.net/mouneeralmzayek',{waitUntil:'domcontentloaded',timeout:18000});
                const urls=await profile.locator('a[href*="/gallery/"]').evaluateAll(as=>as.map(a=>({href:a.href,text:(a.innerText+' '+a.getAttribute('aria-label')+' '+(a.querySelector('img')?.alt||'')).toLowerCase()})));
                const match=urls.find(x=>x.text.includes(designTitles[name])||x.href.toLowerCase().includes(designTitles[name].replaceAll(' ','-')));
                if(match&&new URL(match.href).hostname==='www.behance.net')candidates.unshift(match.href);
              }catch{}finally{await profile.close();}
            }
            if(name==='M.O.U.N.I.R'||!candidates.length){report.push({name,status:'private/no public source',preview:'conceptual'});return;}
            const page=await browser.newPage({viewport:{width:1360,height:850},deviceScaleFactor:1,reducedMotion:'reduce',locale:'en-US'});
            const errors=[];
            try{
              for(const url of candidates){
                try{
                  await page.goto('about:blank').catch(()=>{});
                  const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
                  if(!res?.ok())throw Error('HTTP '+res?.status());
                  await page.waitForLoadState('networkidle',{timeout:3500}).catch(()=>{});
                  const isAsset=new URL(url).hostname==='raw.githubusercontent.com';
                  const title=await page.title();
                  if(target?.file==='visitors-official')await page.waitForFunction(()=>document.body.innerText.trim().length>100,{},{timeout:8000}).catch(()=>{});
                  const body=await page.locator('body').innerText();
                  if(!isAsset&&(body.trim().length<70||/access denied|just a moment|verify you are human|page not found|bad gateway|sign in to github/i.test(title+' '+body.slice(0,180))))throw Error('Unusable page');
                  const path='assets/previews/sources/'+(target?target.file:'source-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))+'.jpg';
                  const repoPage=new URL(url).hostname==='github.com';
                  if(repoPage&&!page.url().toLowerCase().includes(new URL(url).pathname.toLowerCase()))throw Error('Unexpected repository redirect');
                  if(isAsset){
                    const img=page.locator('img').first();
                    await img.waitFor({timeout:5000});
                    if(!await img.evaluate(i=>i.naturalWidth>50))throw Error('Invalid image');
                    await img.screenshot({path,type:'jpeg',quality:88,animations:'disabled'});
                  }else{
                    await page.screenshot({path,type:'jpeg',quality:84,animations:'disabled'});
                  }
                  const label=target?(new URL(url).hostname==='www.rs4it.sa'?'Official RS4IT product description':target.label):isAsset?'Original public repository asset':repoPage?'Public source repository · not an app screenshot':url.includes('play.google.com')?'Official Google Play listing':url.includes('behance.net')?'Original published design project · Behance':'Official website · captured preview';
                  const dest=isAsset?(repo||url):url;
                  const fig='<figure class="source-preview"><a href="'+esc(dest)+'"><img src="'+path+'" alt="'+esc(name)+' — '+esc(label)+'" loading="lazy" decoding="async"></a><span class="media-fallback">Open original source ↗</span><figcaption>'+esc(label)+'</figcaption></figure>';
                  const original=card.match(/<figure\b[^>]*>[\s\S]*?<\/figure>/)?.[0];
                  if(!original)throw Error('Missing original figure');
                  replacements.set(card,card.replace(original,fig));
                  report.push({name,status:'captured',kind:label,url,path});return;
                }catch(e){errors.push({url,error:String(e)});}
              }
              report.push({name,status:'fallback',errors});
            }finally{await page.close();}
          }
          for(let i=0;i<cards.length;i+=4)await Promise.all(cards.slice(i,i+4).map((c,j)=>capture(c,i+j)));
          let updated=html;
          for(const [old,next] of replacements)updated=updated.replace(old,next);
          fs.writeFileSync('index.html',updated);
          fs.writeFileSync('assets/previews/sources/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          JS
      - name: Validate all projects and layouts
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch();
          for(const width of [390,1440]){
            const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            if(await page.locator('.project').count()!==33)throw Error('Missing cards (33 expected)');
            if(await page.locator('.project figure').count()!==33)throw Error('Missing preview');
            if(await page.locator('[data-project-group="apps"] article h3').first().innerText()!=='Zaker')throw Error('Zaker must lead published apps');
            if(await page.locator('.project h3').filter({hasText:'Solar Intelligence'}).count())throw Error('Removed research portal still visible');
            if(await page.locator('.project a[href="https://ncpop.org.sa/"]').count()<1||await page.locator('.project a[href="https://visitors-rs.com/"]').count()<1)throw Error('Missing official sites');
            if(await page.locator('.profile-photo').evaluate(i=>getComputedStyle(i).filter)!=='none')throw Error('Portrait not in natural color');
            await page.locator('[data-filter="ai"]').click();
            await page.locator('[data-filter="all"]').click();
            if(await page.locator('.archive-details').getAttribute('open')===null)await page.locator('.archive-details summary').click();
            const broken=await page.locator('img[src^="assets/previews/"]').evaluateAll(async imgs=>{await Promise.all(imgs.map(i=>{i.loading='eager';return i.decode().catch(()=>{})}));return imgs.filter(i=>!i.naturalWidth).map(i=>i.src)});
            if(broken.length)throw Error('Broken local images '+broken.join(','));
            if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw Error('Horizontal overflow at '+width);
            await page.locator('#theme-toggle').click();
            if(await page.locator('html').getAttribute('data-theme')!=='dark')throw Error('Theme toggle failed');
            await page.locator('#theme-toggle').click();
            if(errors.length)throw Error(errors.join('; '));
            await page.screenshot({path:'/tmp/portfolio-'+width+'.png',fullPage:true,animations:'disabled'});
            await page.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-preview-verification
          path: |
            /tmp/portfolio-*.png
            assets/previews/sources/
      - name: Publish captured sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/previews/sources/
          if ! git diff --cached --quiet; then
            git commit -m "Add authentic project source previews"
            git push origin HEAD:main
          fi
