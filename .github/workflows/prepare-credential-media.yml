name: Prepare credential and organization media
on:
  push:
    branches: [content/credential-and-brand-media]
    paths: ['.github/workflows/prepare-credential-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/content/credential-and-brand-media'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/prepare-credential-media.mjs
      - run: node scripts/build.mjs && node scripts/build.mjs --check
      - name: Commit sourced media and both pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/credentials src/templates/about.html i18n index.html ar/index.html
          git commit -m "Publish attributable organization logos and credential previews"
          git push origin HEAD:content/credential-and-brand-media
