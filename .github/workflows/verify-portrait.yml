name: Portfolio quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['index.html', 'ar/**', 'src/**', 'i18n/**', 'scripts/**', 'assets/**', '.github/workflows/verify-portrait.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared templates, translations and generated routes
        run: |
          node --test tests/render.test.mjs
          node scripts/build.mjs --check
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Validate portfolio
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/portfolio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-checks
          path: /tmp/portfolio-*.png
