name: Verify Visitors and Bin Taleb previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-visitors-bin-taleb.yml']
permissions:
  contents: write
concurrency:
  group: visitors-bin-taleb
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Capture official sources
        run: |
          mkdir -p assets/previews/sources
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch();
          let html=fs.readFileSync('index.html','utf8');
          const report={binTaleb:[],visitors:{status:'unavailable',attempts:[]}};
          const card=html.match(/<figure class="product-shot app-shot" data-store-gallery="bin-taleb">[\s\S]*?<\/figure>/)?.[0];
          if(!card)throw Error('Bin Taleb gallery missing');
          let gallery=card;
          const urls=[...card.matchAll(/src="(https:\/\/play-lh\.googleusercontent\.com\/[^"]+)"/g)].map(m=>m[1]);
          const ctx=await browser.newContext({locale:'ar-SA'});
          for(const [i,url] of urls.entries()){
            try{
              const response=await ctx.request.get(url,{timeout:15000});
              const mime=(response.headers()['content-type']||'').split(';')[0];
              const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[mime];
              if(!response.ok()||!ext)throw Error('Invalid image HTTP '+response.status());
              const bytes=await response.body();
              if(bytes.length<2000)throw Error('Invalid image size');
              const file='assets/previews/sources/bin-taleb-official-'+(i+1)+'.'+ext;
              fs.writeFileSync(file,bytes);
              gallery=gallery.replace(url,file);
              report.binTaleb.push({status:'saved',url,file});
            }catch(e){report.binTaleb.push({status:'failed',url,error:String(e)});}
          }
          html=html.replace(card,gallery);
          await ctx.close();
          const targets=['https://visitors-rs.com/','https://visitors-rs.com/demo/','https://visitors-rs.com/dashboards-portals/','https://visitors-rs.com/visitor-pre-registration/','https://visitors-rs.com/qr-visitor-system/'];
          for(const url of targets){
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1,locale:'ar-SA',reducedMotion:'reduce'});
            try{
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:18000});
              if(!response?.ok())throw Error('HTTP '+response?.status());
              await page.waitForLoadState('networkidle',{timeout:5000}).catch(()=>{});
              await page.waitForFunction(()=>/زوار|الزائر|الزيارة|Visitor Management/i.test(document.body?.innerText||''),{},{timeout:5000}).catch(()=>{});
              const title=await page.title();
              const body=await page.locator('body').innerText();
              if(new URL(page.url()).hostname!=='visitors-rs.com'||!(/زوار|الزائر|الزيارة|Visitor Management/i.test(title+' '+body))||body.trim().length<100||/just a moment|access denied|verify you are human|bad gateway|attention required|checking your browser/i.test(title+' '+body.slice(0,250)))throw Error('Not verified product content: '+title+' / '+body.slice(0,100));
              await page.evaluate(()=>document.fonts.ready);
              const path='assets/previews/sources/visitors-live-site.jpg';
              await page.screenshot({path,type:'jpeg',quality:87,animations:'disabled'});
              const old=html.match(/<figure class="source-preview" data-visitors-preview>[\s\S]*?<\/figure>/)?.[0];
              if(!old)throw Error('Visitors figure missing');
              html=html.replace(old,'<figure class="source-preview" data-visitors-preview><a href="https://visitors-rs.com/"><img src="'+path+'" alt="Official Visitors product website screenshot" loading="lazy" decoding="async"></a><figcaption>Official Visitors product website · '+(url===targets[0]?'homepage':'product walkthrough')+'</figcaption></figure>');
              report.visitors={status:'captured',url:page.url(),path,title,attempts:report.visitors.attempts};
              break;
            }catch(e){report.visitors.attempts.push({url,error:String(e)});}
            finally{await page.close();}
          }
          fs.writeFileSync('index.html',html);
          fs.writeFileSync('assets/previews/sources/visitors-bin-taleb-report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          JS
      - name: Test previews on mobile and desktop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch();
          for(const width of [390,1440]){
            const page=await browser.newPage({viewport:{width,height:900}});
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            if(await page.locator('.project').count()!==33)throw Error('Project count changed');
            const gallery=page.locator('[data-store-gallery="bin-taleb"] img');
            if(await gallery.count()!==3)throw Error('Expected three Bin Taleb images');
            const missing=await gallery.evaluateAll(async imgs=>{await Promise.all(imgs.map(i=>{i.loading='eager';return i.decode().catch(()=>{})}));return imgs.filter(i=>!i.naturalWidth).map(i=>i.src)});
            if(missing.length)throw Error('Broken Bin Taleb images '+missing.join(','));
            const visitors=page.locator('[data-visitors-preview]');
            if(await visitors.locator('a').getAttribute('href')!=='https://visitors-rs.com/')throw Error('Incorrect Visitors destination');
            if(await visitors.locator('img').count()&&!(await visitors.locator('img').evaluate(async i=>{i.loading='eager';await i.decode();return i.naturalWidth>0})))throw Error('Broken Visitors screenshot');
            if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw Error('Layout overflow');
            await page.screenshot({path:'/tmp/portfolio-'+width+'.png',fullPage:true});
            await page.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitors-bin-taleb-verification
          path: |
            /tmp/portfolio-*.png
            assets/previews/sources/visitors-bin-taleb-report.json
            assets/previews/sources/visitors-live-site.jpg
            assets/previews/sources/bin-taleb-official-*
      - name: Publish verified previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/previews/sources/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified official Visitors and Bin Taleb previews"
            git push origin HEAD:main
          fi
