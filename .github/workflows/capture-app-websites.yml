name: Capture official app websites
on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-app-websites.yml', 'scripts/capture-app-websites.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capture-official-app-websites
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - run: node scripts/capture-app-websites.mjs
      - name: Commit genuine website captures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/previews/website-captures.json
          if [ -d assets/previews/websites ]; then git add assets/previews/websites; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture official app website previews"
          git pull --rebase origin main
          git push origin HEAD:main
