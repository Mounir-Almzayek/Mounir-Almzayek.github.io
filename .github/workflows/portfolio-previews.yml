name: Capture portfolio previews and smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/portfolio-previews.yml']
permissions:
  contents: write
concurrency:
  group: portfolio-previews
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capture verified public pages
        shell: bash
        run: |
          mkdir -p assets/previews
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const targets = [
            {name:'tebyan',url:'https://tebyan-website.tebyan-sy-official.workers.dev/ar',original:'https://tebyan-website.tebyan-sy-official.workers.dev/experience/09-mosque-prayer-display.avif',label:'Tebyan'},
            {name:'liqaa',url:'https://www.byliqaa.me/ar',original:'https://www.byliqaa.me/images/landing/steps-invitation-arch.png',label:'Liqaa'},
            {name:'mazeed',url:'https://mazeed.arambs.com/',label:'Mazeed'}
          ];
          let html=fs.readFileSync('index.html','utf8');
          const report=[];
          for(const target of targets){
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1,locale:'ar',reducedMotion:'reduce'});
            try{
              const response=await page.goto(target.url,{waitUntil:'domcontentloaded',timeout:45000});
              if(!response?.ok()) throw Error('HTTP '+response?.status());
              await page.waitForLoadState('networkidle',{timeout:10000}).catch(()=>{});
              await page.evaluate(()=>document.fonts.ready);
              const title=await page.title();
              const body=await page.locator('body').innerText();
              if(body.trim().length<80 || /access denied|just a moment|verify you are human|application error|bad gateway|page not found/i.test(title+' '+body.slice(0,250))) throw Error('Page appears unavailable or blocked');
              const path='assets/previews/'+target.name+'.jpg';
              await page.screenshot({path,type:'jpeg',quality:88,animations:'disabled'});
              const old='src="'+target.original+'"';
              if(target.original && html.includes(old)) html=html.replace(old,'src="'+path+'"');
              if(target.name==='mazeed') html=html.replace(/<div class="site-placeholder">MAZEED <span>Product website ↗<\/span><\/div>/,'<img src="'+path+'" alt="Live Mazeed product website" loading="lazy" decoding="async">');
              report.push({project:target.label,title,url:page.url(),status:'captured',path});
            }catch(error){report.push({project:target.label,status:'failed',error:String(error)});}
            finally{await page.close();}
          }
          const apps=[
            {key:'saudi-cup',title:'The Saudi Cup',id:'com.app.saudicup',fallback:'https://play-lh.googleusercontent.com/-ywx5qibX3HF4LmxLXCn_kBFfdoMpdvkrMieNbao_UjIDEfTj7OJdpcPerf5nKnqB64=w526-h296'},
            {key:'bin-taleb',title:'Bin Taleb',id:'com.rs4it.bin_taleb',fallback:'https://play-lh.googleusercontent.com/4vJnJhOpb_0xzukaMawh8ow-sNG9SPExPqukLYn4U6BB99YEVnwF39jUTOvX0oSRPw4tTPSwJ1Zii6jFts6r-A=w526-h296'},
            {key:'swimmer',title:'The Swimmer',id:'com.rs4it.swimmer',fallback:'https://play-lh.googleusercontent.com/Qbf-ka13hO_2a0bAft1vTVGIL8EZVAu5-yFJenW1-8OTBWyGWaAlws2QSMEJSW1x6EQj1tJCFtnE9lfLhItZBg=w526-h296'}
          ];
          for(const app of apps){
            const page=await browser.newPage({viewport:{width:1440,height:1000},locale:'en-US'});
            const store='https://play.google.com/store/apps/details?id='+app.id;
            const saved=[];
            let sources=[];
            try{
              const response=await page.goto(store+'&hl=en&gl=SA',{waitUntil:'domcontentloaded',timeout:35000});
              if(!response?.ok())throw Error('Store HTTP '+response?.status());
              await page.locator('img[alt*="Screenshot" i]').first().waitFor({timeout:12000});
              sources=await page.locator('img[alt*="Screenshot" i]').evaluateAll(imgs=>imgs.map(i=>i.getAttribute('src')||i.currentSrc).filter(Boolean));
            }catch(error){console.log(app.title+' listing: '+error);}
            const candidates=[...new Set([...sources,app.fallback].filter(url=>{try{return new URL(url).hostname==='play-lh.googleusercontent.com'}catch{return false}}).map(url=>url.replace(/=w\d+-h\d+.*$/,'')+'=w720-h1280'))];
            for(const src of candidates.slice(0,8)){
              if(saved.length===3)break;
              try{
                const response=await page.request.get(src,{timeout:15000});
                const mime=(response.headers()['content-type']||'').split(';')[0];
                const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[mime];
                if(!response.ok()||!ext)continue;
                const bytes=await response.body();
                if(bytes.length<2000||bytes.length>8000000)continue;
                const dest='assets/previews/'+app.key+'-'+(saved.length+1)+'.'+ext;
                fs.writeFileSync(dest,bytes);saved.push({path:dest,source:src});
              }catch(error){console.log(app.title+' image: '+error)}
            }
            if(saved.length){
              const imageTags=saved.map((img,i)=>'<img src="'+img.path+'" alt="'+app.title+' official Google Play screenshot '+(i+1)+'" loading="lazy" decoding="async">').join('');
              const start=html.indexOf('data-store-gallery="'+app.key+'"');
              if(start<0)throw Error('Missing gallery '+app.key);
              const close=html.indexOf('</figure>',start);
              const markup=html.slice(start,close);
              const replaced=markup.replace(/<a\b[^>]*>[\s\S]*?<\/a>/,'<a class="store-gallery" style="grid-template-columns:repeat('+saved.length+',minmax(0,1fr))" href="'+store+'" aria-label="Open '+app.title+' on Google Play">'+imageTags+'</a>');
              html=html.slice(0,start)+replaced+html.slice(close);
            }
            report.push({project:app.title,url:store,status:saved.length?'captured':'fallback',screenshots:saved});
            await page.close();
          }
          fs.writeFileSync('index.html',html);
          fs.writeFileSync('assets/previews/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          JS
      - name: Responsive and interaction smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch();
          for(const width of [1440,390]){
            const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            await page.locator('#theme-toggle').click();
            if(await page.locator('html').getAttribute('data-theme')!=='dark')throw Error('Dark mode failed');
            await page.locator('#theme-toggle').click();
            await page.locator('[data-filter="ai"]').click();
            if(await page.locator('.project:not([hidden])').count()===0)throw Error('AI filter failed');
            await page.locator('[data-filter="published"]').click();
            if(await page.locator('.project:not([hidden])').count()!==3)throw Error('Published app filter failed');
            if(await page.locator('.project-group:not([hidden])').count()!==1)throw Error('Empty groups not hidden');
            await page.locator('[data-filter="all"]').click();
            if(await page.locator('.project-group:not([hidden])').count()!==4)throw Error('Expected four project groups');
            if(await page.locator('.app-card .project-links a').count()!==6)throw Error('Missing official mobile app links');
            const missingLocal=await page.locator('img[src^="assets/previews/"]').evaluateAll(async imgs=>{await Promise.all(imgs.map(i=>{i.loading='eager';return i.decode().catch(()=>{})}));return imgs.filter(i=>!i.naturalWidth).map(i=>i.src)});
            if(missingLocal.length)throw Error('Missing local preview '+missingLocal.join(', '));
            if(await page.locator('.project:not([hidden])').count()!==13)throw Error('Expected 13 project cards');
            if(await page.locator('#resumes a[href*="drive.google.com/file/d/"]').count()!==4)throw Error('Missing original CV links');
            if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw Error('Horizontal overflow at '+width);
            if(errors.length)throw Error(errors.join('; '));
            await page.screenshot({path:'/tmp/portfolio-'+width+'.png',fullPage:true,animations:'disabled'});
            await page.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-verification
          path: |
            /tmp/portfolio-*.png
            assets/previews/
      - name: Commit real previews after checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/previews/
          if ! git diff --cached --quiet; then
            git commit -m "Capture public project website previews"
            git push origin HEAD:main
          fi
